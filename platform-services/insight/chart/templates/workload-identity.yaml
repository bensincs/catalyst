{{- if .Values.agenticCore.workloadIdentity.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agenticCore.workloadIdentity.serviceAccountName | default "agentic-core-sa" }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.appInfra.workloadIdentityClientId | default .Values.agenticCore.workloadIdentity.clientId | quote }}
  labels:
    azure.workload.identity/use: "true"
    app: agentic-core
automountServiceAccountToken: false
{{- end }}

