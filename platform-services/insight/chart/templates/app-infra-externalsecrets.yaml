{{- if .Values.appInfra.externalSecrets.enabled }}
{{- $vaultUrl := required "appInfra.keyvaultUrl is required when appInfra.externalSecrets.enabled=true" .Values.appInfra.keyvaultUrl }}
{{- $tenantId := required "appInfra.keyvaultTenantId is required when appInfra.externalSecrets.enabled=true" .Values.appInfra.keyvaultTenantId }}
{{- $storeName := .Values.appInfra.externalSecrets.secretStoreName | default "insight-app-infra" }}
{{- $saName := .Values.appInfra.externalSecrets.serviceAccountName | default "backend-sa" }}
{{- $insightSecretsName := .Values.appConfig.secrets.secretName | default "insight-secrets" }}
---
# Chart-owned, namespace-scoped SecretStore bound to the per-app Key Vault
# via workload identity. vaultUrl is injected by the tenant operator
# (appInfra.keyvaultUrl); the service account holds the federated credential
# and the "Key Vault Secrets User" role granted in infra/tenant/app/insight.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: insight
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $vaultUrl | quote }}
      tenantId: {{ $tenantId | quote }}
      serviceAccountRef:
        name: {{ $saName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $insightSecretsName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: insight
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName }}
    kind: SecretStore
  target:
    name: {{ $insightSecretsName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: insight--backend--database-url
      remoteRef:
        key: insight-backend-database-url
    # llm-gateway shares the insight Postgres database but needs a Prisma-
    # compatible URL scheme (postgresql://) published under a dedicated key.
    - secretKey: insight--llm--database-url
      remoteRef:
        key: insight-llm-database-url
    - secretKey: insight--backend--jwt-secret-key
      remoteRef:
        key: insight-jwt-secret-key
    - secretKey: insight--llm-gateway--master-key
      remoteRef:
        key: insight-llm-gateway-master-key
    # cortex resolves a user's roles through the platform authorization
    # service. Without this token it raises "authz token is not configured" and
    # /auth/me returns 401 for every user, which reads as a login failure rather
    # than a missing credential.
    - secretKey: insight--authz--admin-token
      remoteRef:
        key: insight-authz-admin-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spicedb-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: spicedb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName }}
    kind: SecretStore
  target:
    name: spicedb-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: preshared_key
      remoteRef:
        key: insight-spicedb-preshared-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spicedb-postgres-credentials
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: spicedb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName }}
    kind: SecretStore
  target:
    name: spicedb-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: connection-uri
      remoteRef:
        key: insight-spicedb-connection-uri
{{- end }}
