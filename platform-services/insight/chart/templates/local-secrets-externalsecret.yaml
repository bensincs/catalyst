{{- /*
  Local-only secret bootstrap for AD mode (non-App-Config).

  Locally insight deploys on chart defaults: Azure App Configuration and the
  per-app Key Vault path (appInfra.externalSecrets) are both off, so the backend
  (AD-mode env branch) and SpiceDB reference plain Secrets that nothing
  else creates. These ExternalSecrets materialise those Secrets from the
  cluster-wide cortex-registry ClusterSecretStore (Vault dev mode locally; seed
  the keys via the root `make bootstrap-secrets`).

  Mutually exclusive with the Azure path: app-infra-externalsecrets.yaml emits
  the same Secret names (insight-secrets / spicedb-config /
  spicedb-postgres-credentials) and the same dotted secret keys
  (insight--backend--*) and is gated solely on appInfra.externalSecrets.enabled,
  so gating this template on `not appInfra.externalSecrets.enabled` guarantees
  exactly one creator and one key scheme across both modes. Vault KV v2 secrets
  are JSON objects, so each remoteRef carries an explicit `property` (unlike the
  flat azurekv path).
*/ -}}
{{- if and .Values.localSecrets.enabled (not .Values.appInfra.externalSecrets.enabled) }}
{{- $storeName := .Values.localSecrets.secretStoreName | default "cortex-registry" }}
{{- $insightSecretsName := .Values.appConfig.secrets.secretName | default "insight-secrets" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $insightSecretsName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: insight
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $insightSecretsName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: insight--backend--database-url
      remoteRef:
        key: insight-backend-secrets
        property: DATABASE_URL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: insight--backend--jwt-secret-key
      remoteRef:
        key: insight-backend-secrets
        property: JWT_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: insight--backend--smtp-password
      remoteRef:
        key: insight-backend-secrets
        property: SMTP_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # llm-gateway (LiteLLM) DB + master key. Seeded into Vault by
    # `make bootstrap-insight-secrets` (secret/insight-llm-secrets). The
    # llm-gateway reads these from insight-secrets when set, so they stay out of
    # committed values (real Azure Postgres URL + master key).
    - secretKey: insight--llm-gateway--database-url
      remoteRef:
        key: insight-llm-secrets
        property: database-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: insight--llm-gateway--master-key
      remoteRef:
        key: insight-llm-secrets
        property: master-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spicedb-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: spicedb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: spicedb-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: preshared_key
      remoteRef:
        key: insight-spicedb-config
        property: preshared_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spicedb-postgres-credentials
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: spicedb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: spicedb-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: connection-uri
      remoteRef:
        key: insight-spicedb-postgres-credentials
        property: connection-uri
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
