{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      {{- if .Values.global.otelPythonInstrumentation.enabled }}
      annotations:
        instrumentation.opentelemetry.io/inject-python: {{ .Values.global.otelPythonInstrumentation.value | quote }}
      {{- end }}
      labels:
        app: backend
        {{- if .Values.backend.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- if .Values.cortexEgress.enabled }}
        # Reach Microsoft Entra ID on 443 for the workload-identity token exchange.
        # On Cortex the tenant default-deny-egress only admits public 443 for pods
        # labelled cortex.ai/egress-internet=true (allow-tool-internet-egress);
        # without it every AAD-authenticated Azure call (Storage/Service Bus/KV/...)
        # hangs on an egress timeout. IMDS stays blocked, which workload identity
        # does not need. Harmless off-Cortex (no such policy).
        cortex.ai/egress-internet: "true"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.backend.workloadIdentity.enabled }}
      serviceAccountName: {{ .Values.backend.workloadIdentity.serviceAccountName | default "backend-sa" }}
      {{- end }}
      {{- include "insight.podSecurityContext" . | nindent 6 }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          {{- include "insight.containerSecurityContext" . | nindent 10 }}
          image: busybox:1.36
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres to be ready..."
              until nc -z postgres.{{ .Values.global.namespace | default .Release.Namespace }}.svc.cluster.local 5432; do
                echo "Postgres is unavailable - sleeping"
                sleep 2
              done
              echo "✅ Postgres is ready!"
        {{- end }}
        - name: run-migrations
          {{- include "insight.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.imageRegistry }}{{ if .Values.imageRegistry }}/{{end}}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Values.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "========================================="
              echo "backend init: running locked startup migrations"
              echo "========================================="
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set — cannot run migrations"
                exit 1
              fi
              echo "DATABASE_URL is set (length=${#DATABASE_URL})"
              DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed 's/%/%%/g')"
              python scripts/run_startup_migrations.py
              echo "backend init: migrations complete"
              {{- if eq .Values.backend.env.ENVIRONMENT "development" }}

              echo ""
              echo "========================================="
              echo "Seeding development data..."
              echo "========================================="
              python seed_data.py || echo "Seed data skipped (may already exist)"
              echo "Initialization complete!"
              {{- end }}
          {{- if .Values.appConfig.enabled }}
          # Azure App Configuration mode
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--database-url
                  optional: true
            - name: ENVIRONMENT
              value: {{ .Values.backend.env.ENVIRONMENT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
          {{- else }}
          # AD mode
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--database-url
            - name: ENVIRONMENT
              value: {{ .Values.backend.env.ENVIRONMENT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
          {{- end }}
        - name: apply-spicedb-schema
          {{- include "insight.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.imageRegistry }}{{ if .Values.imageRegistry }}/{{end}}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Values.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "========================================="
              echo "backend init: applying SpiceDB schema"
              echo "========================================="
              python scripts/apply_spicedb_schema.py
              echo "backend init: SpiceDB schema ready"
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
            - name: SPICEDB_ENDPOINT
              value: {{ .Values.backend.env.SPICEDB_ENDPOINT | default "spicedb:50051" | quote }}
            - name: SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: spicedb-config
                  key: preshared_key
            - name: SPICEDB_INSECURE
              value: {{ .Values.backend.env.SPICEDB_INSECURE | default "true" | quote }}
        {{- if .Values.backend.seedOrganization.enabled }}
        # Ensure the tenant has a default organization so meeting groups can be
        # created/listed. Environment-agnostic and idempotent (ON CONFLICT DO
        # NOTHING); seeds a fixed system user first to satisfy the NOT NULL FKs
        # on organizations.admin_id/created_by/updated_by. Org id defaults to
        # the value the BFF queries (ORGANIZATION_ID) so the two line up.
        - name: seed-org
          {{- include "insight.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.imageRegistry }}{{ if .Values.imageRegistry }}/{{end}}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Values.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "========================================="
              echo "backend init: ensuring default organization"
              echo "========================================="
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set — cannot seed organization"
                exit 1
              fi
              # Script is chart-owned and mounted from a ConfigMap (not bundled
              # in the backend image). Run it with the image's venv python so
              # sqlalchemy/asyncpg resolve.
              python /seed/seed_tenant_org.py
              echo "backend init: organization ready"
          volumeMounts:
            - name: seed-org-script
              mountPath: /seed
              readOnly: true
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
            {{- if .Values.appConfig.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--database-url
                  optional: true
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--database-url
            {{- end }}
            - name: SEED_ORGANIZATION_ID
              value: {{ .Values.backend.seedOrganization.organizationId | quote }}
            - name: SEED_ORGANIZATION_NAME
              value: {{ .Values.backend.seedOrganization.organizationName | quote }}
            - name: SEED_ORGANIZATION_SLUG
              value: {{ .Values.backend.seedOrganization.organizationSlug | quote }}
            - name: SEED_SYSTEM_USER_ID
              value: {{ .Values.backend.seedOrganization.systemUserId | quote }}
            - name: SEED_SYSTEM_USER_EMAIL
              value: {{ .Values.backend.seedOrganization.systemUserEmail | quote }}
        {{- end }}
      containers:
        - name: backend
          {{- include "insight.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.imageRegistry }}{{ if .Values.imageRegistry }}/{{end}}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Values.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          {{- if .Values.appConfig.enabled }}
          # Azure App Configuration mode: Load config from synced ConfigMap/Secret
          envFrom:
            - configMapRef:
                name: {{ .Values.appConfig.configMapName | default "insight-config" }}
                optional: true
            {{- if .Values.appConfig.secrets.enabled }}
            - secretRef:
                name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                optional: true
            {{- end }}
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
            # Override specific vars that may have different key names in AppConfig
            # These map from AppConfig key format (insight--backend--*) to expected env vars
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--database-url
                  optional: true
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--jwt-secret-key
                  optional: true
            # Example of loading BFF API URL from AppConfig, with fallback to Helm values if not set in AppConfig
            - name: BFF_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.appConfig.configMapName | default "insight-config" }}
                  key: insight--bff--api-url
                  optional: true
            # Fallback to Helm values for non-AppConfig keys
            - name: JWT_ALGORITHM
              value: {{ .Values.backend.env.JWT_ALGORITHM | quote }}
            - name: JWT_EXPIRE_MINUTES
              value: {{ .Values.backend.env.JWT_EXPIRE_MINUTES | quote }}
            # SpiceDB configuration
            - name: SPICEDB_ENDPOINT
              value: {{ .Values.backend.env.SPICEDB_ENDPOINT | default "spicedb:50051" | quote }}
            - name: SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: spicedb-config
                  key: preshared_key
            - name: SPICEDB_INSECURE
              value: {{ .Values.backend.env.SPICEDB_INSECURE | default "true" | quote }}

            # Email configuration
            # Prefer platform ACS (appInfra.*) via workload identity; SMTP remains
            # the local/dev fallback when acsEndpoint is empty.
            - name: EMAIL_PROVIDER
              value: {{ if .Values.appInfra.acsEndpoint }}acs{{ else }}{{ .Values.backend.env.EMAIL_PROVIDER }}{{ end }}
            {{- if .Values.appInfra.acsEndpoint }}
            - name: ACS_ENDPOINT
              value: {{ .Values.appInfra.acsEndpoint | quote }}
            - name: ACS_FROM_EMAIL
              value: {{ .Values.appInfra.acsFromEmail | default .Values.backend.env.ACS_FROM_EMAIL | default "" | quote }}
            - name: ACS_USE_MANAGED_IDENTITY
              value: "true"
            {{- else }}
            - name: SMTP_HOST
              value: {{ .Values.backend.env.SMTP_HOST | quote }}
            - name: SMTP_PORT
              value: {{ .Values.backend.env.SMTP_PORT | quote }}
            - name: SMTP_USE_TLS
              value: {{ .Values.backend.env.SMTP_USE_TLS | quote }}
            - name: SMTP_USE_SSL
              value: {{ .Values.backend.env.SMTP_USE_SSL | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.backend.env.SMTP_USERNAME | quote }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--smtp-password
                  optional: true
            {{- end }}
            # Base URL for generating email activation links
            - name: LOG_IN_URL
              value: {{ .Values.backend.env.LOG_IN_URL | quote }}

            # Internal BFF access token for secure communication with backend services (injected via Helm values or AppConfig)
            - name: INTERNAL_BFF_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--bff--internal-bff-access-token
                  optional: true 


            # Azure Storage Configuration
            # Prefer per-tenant infra (appInfra.* from the app-infra-insight
            # ConfigMap) so Cortex tenants hit their OWN storage account/containers;
            # fall back to the values-driven dev defaults elsewhere.
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ .Values.appInfra.storageAccountName | default .Values.backend.env.AZURE_STORAGE_ACCOUNT_NAME | quote }}
            - name: AZURE_STORAGE_CONTAINER
              value: {{ include "insight.pickStorageContainer" (dict "ctx" $ "match" "user-documents" "fallback" .Values.backend.env.AZURE_STORAGE_CONTAINER) | quote }}
            {{- if or .Values.appInfra.storageContainers .Values.backend.env.AZURE_AUDIO_BRIEF_CONTAINER }}
            - name: AZURE_AUDIO_BRIEF_CONTAINER
              value: {{ include "insight.pickStorageContainer" (dict "ctx" $ "match" "audio-brief" "fallback" .Values.backend.env.AZURE_AUDIO_BRIEF_CONTAINER) | quote }}
            {{- end }}
            - name: STORAGE_BACKEND
              value: {{ .Values.backend.env.STORAGE_BACKEND | quote }}
            {{- if .Values.backend.env.M365_CONNECTOR_BASE_URL }}
            - name: M365_CONNECTOR_BASE_URL
              value: {{ .Values.backend.env.M365_CONNECTOR_BASE_URL | quote }}
            {{- end }}
            # Azure Service Bus Configuration
            - name: AZURE_SERVICE_BUS_NAME
              value: {{ .Values.appInfra.serviceBusFqdn | default .Values.backend.env.AZURE_SERVICE_BUS_NAME | default "sb-insight-dev-incp-uaen-001.servicebus.windows.net" | quote }}
            - name: AZURE_SERVICE_BUS_QUEUE_NAME
              value: {{ .Values.backend.env.AZURE_SERVICE_BUS_QUEUE_NAME | default "meeting-queue" | quote }}
            # Indexer V2 publishes to a (potentially different) namespace/queue; keep
            # this separate from AZURE_SERVICE_BUS_NAME so the meeting-queue path is
            # unaffected when V2 targets an external Service Bus (e.g. rag-ingestion).
            {{- if or .Values.appInfra.ragServiceBusFqdn .Values.backend.env.AZURE_SERVICE_BUS_NAMESPACE }}
            - name: AZURE_SERVICE_BUS_NAMESPACE
              value: {{ .Values.appInfra.ragServiceBusFqdn | default .Values.backend.env.AZURE_SERVICE_BUS_NAMESPACE | quote }}
            {{- end }}
            {{- if .Values.backend.env.AZURE_STORAGE_CONNECTION_STRING }}
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--azure-storage-connection-string
                  optional: true
            {{- end }}
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.appConfig.configMapName | default "insight-config" }}
                  key: insight--bff--backend-api-url
                  optional: true
            # Transcription perf internal service config (from App Config)
            - name: BACKEND_INTERNAL_SERVICE_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.appConfig.configMapName | default "insight-config" }}
                  key: insight--backend--BACKEND_INTERNAL_SERVICE_API_KEY
                  optional: true
            - name: ENABLE_TRANSCRIPTION_PERF_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.appConfig.configMapName | default "insight-config" }}
                  key: insight--backend--ENABLE_TRANSCRIPTION_PERF_EVENTS
                  optional: true
            - name: FEATURE_DRAFT_AI_GENERATION_ENABLED
              value: {{ .Values.backend.env.FEATURE_DRAFT_AI_GENERATION_ENABLED | default "true" | quote }}
            # Indexer V2 configuration (feature-flagged, default off)
            {{- if .Values.backend.env.INDEXER_V2_ENABLED }}
            - name: INDEXER_V2_ENABLED
              value: {{ .Values.backend.env.INDEXER_V2_ENABLED | quote }}
            {{- end }}
            {{- /* INDEXER_V2 targets the peer rag-ingestion app: publish to rag's
               control queue (appInfra.ragControlQueue), stamped with this tenant's
               name + application id (appInfra.tenantName/applicationId, which the
               operator injects from insight's own Terraform outputs). Prefer the
               operator-injected appInfra.* peer/identity keys; fall back to the
               backend.env literals for envs without injection. */}}
            {{- if or .Values.appInfra.ragControlQueue .Values.backend.env.INDEXER_V2_INPUT_QUEUE }}
            - name: INDEXER_V2_INPUT_QUEUE
              value: {{ .Values.appInfra.ragControlQueue | default .Values.backend.env.INDEXER_V2_INPUT_QUEUE | quote }}
            {{- end }}
            {{- if or .Values.appInfra.tenantName .Values.backend.env.INDEXER_V2_TENANT_ID }}
            - name: INDEXER_V2_TENANT_ID
              value: {{ .Values.appInfra.tenantName | default .Values.backend.env.INDEXER_V2_TENANT_ID | quote }}
            {{- end }}
            {{- if or .Values.appInfra.applicationId .Values.backend.env.INDEXER_V2_APP_ID }}
            - name: INDEXER_V2_APP_ID
              value: {{ .Values.appInfra.applicationId | default .Values.backend.env.INDEXER_V2_APP_ID | quote }}
            {{- end }}
            {{- if .Values.backend.workloadIdentity.enabled }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.appInfra.workloadIdentityClientId | default .Values.backend.workloadIdentity.clientId | default "" | quote }}
            {{- end }}
            {{- include "insight.otelEnv" $ | nindent 12 }}
          {{- else }}


          # AD mode: config from the ApplicationDeployment spec.helm values
          env:
            {{- include "insight.nonRootEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--database-url
            - name: ENVIRONMENT
              value: {{ .Values.backend.env.ENVIRONMENT | quote }}
            - name: DEBUG
              value: {{ .Values.backend.env.DEBUG | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--jwt-secret-key
            - name: JWT_ALGORITHM
              value: {{ .Values.backend.env.JWT_ALGORITHM | quote }}
            - name: JWT_EXPIRE_MINUTES
              value: {{ .Values.backend.env.JWT_EXPIRE_MINUTES | quote }}
            # SpiceDB configuration
            - name: SPICEDB_ENDPOINT
              value: {{ .Values.backend.env.SPICEDB_ENDPOINT | default "spicedb:50051" | quote }}
            - name: SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: spicedb-config
                  key: preshared_key
            - name: SPICEDB_INSECURE
              value: {{ .Values.backend.env.SPICEDB_INSECURE | default "true" | quote }}

            # Email configuration
            # Prefer platform ACS (appInfra.*) via workload identity; SMTP remains
            # the local/dev fallback when acsEndpoint is empty.
            - name: EMAIL_PROVIDER
              value: {{ if .Values.appInfra.acsEndpoint }}acs{{ else }}{{ .Values.backend.env.EMAIL_PROVIDER }}{{ end }}
            {{- if .Values.appInfra.acsEndpoint }}
            - name: ACS_ENDPOINT
              value: {{ .Values.appInfra.acsEndpoint | quote }}
            - name: ACS_FROM_EMAIL
              value: {{ .Values.appInfra.acsFromEmail | default .Values.backend.env.ACS_FROM_EMAIL | default "" | quote }}
            - name: ACS_USE_MANAGED_IDENTITY
              value: "true"
            {{- else }}
            - name: SMTP_HOST
              value: {{ .Values.backend.env.SMTP_HOST | quote }}
            - name: SMTP_PORT
              value: {{ .Values.backend.env.SMTP_PORT | quote }}
            - name: SMTP_USE_TLS
              value: {{ .Values.backend.env.SMTP_USE_TLS | quote }}
            - name: SMTP_USE_SSL
              value: {{ .Values.backend.env.SMTP_USE_SSL | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.backend.env.SMTP_USERNAME | quote }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--smtp-password
                  optional: true
            {{- end }}
            # Base URL for generating email activation links
            - name: LOG_IN_URL
              value: {{ .Values.backend.env.LOG_IN_URL | quote }}

            - name: BFF_API_URL
              value: {{ .Values.backend.env.BFF_API_URL | default "" | quote }}

            # Azure Storage Configuration
            # Prefer per-tenant infra (appInfra.* from the app-infra-insight
            # ConfigMap) so Cortex tenants hit their OWN storage account/containers;
            # fall back to the values-driven dev defaults elsewhere.
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ .Values.appInfra.storageAccountName | default .Values.backend.env.AZURE_STORAGE_ACCOUNT_NAME | quote }}
            - name: AZURE_STORAGE_CONTAINER
              value: {{ include "insight.pickStorageContainer" (dict "ctx" $ "match" "user-documents" "fallback" .Values.backend.env.AZURE_STORAGE_CONTAINER) | quote }}
            {{- if or .Values.appInfra.storageContainers .Values.backend.env.AZURE_AUDIO_BRIEF_CONTAINER }}
            - name: AZURE_AUDIO_BRIEF_CONTAINER
              value: {{ include "insight.pickStorageContainer" (dict "ctx" $ "match" "audio-brief" "fallback" .Values.backend.env.AZURE_AUDIO_BRIEF_CONTAINER) | quote }}
            {{- end }}
            - name: STORAGE_BACKEND
              value: {{ .Values.backend.env.STORAGE_BACKEND | quote }}
            {{- if .Values.backend.env.M365_CONNECTOR_BASE_URL }}
            - name: M365_CONNECTOR_BASE_URL
              value: {{ .Values.backend.env.M365_CONNECTOR_BASE_URL | quote }}
            {{- end }}
            # Azure Service Bus Configuration
            - name: AZURE_SERVICE_BUS_NAME
              value: {{ .Values.appInfra.serviceBusFqdn | default .Values.backend.env.AZURE_SERVICE_BUS_NAME | default "sb-insight-dev-incp-uaen-001.servicebus.windows.net" | quote }}
            - name: AZURE_SERVICE_BUS_QUEUE_NAME
              value: {{ .Values.backend.env.AZURE_SERVICE_BUS_QUEUE_NAME | default "meeting-queue" | quote }}
            # Indexer V2 publishes to a (potentially different) namespace/queue; keep
            # this separate from AZURE_SERVICE_BUS_NAME so the meeting-queue path is
            # unaffected when V2 targets an external Service Bus (e.g. rag-ingestion).
            {{- if or .Values.appInfra.ragServiceBusFqdn .Values.backend.env.AZURE_SERVICE_BUS_NAMESPACE }}
            - name: AZURE_SERVICE_BUS_NAMESPACE
              value: {{ .Values.appInfra.ragServiceBusFqdn | default .Values.backend.env.AZURE_SERVICE_BUS_NAMESPACE | quote }}
            {{- end }}
            {{- if .Values.backend.env.AZURE_STORAGE_CONNECTION_STRING }}
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appConfig.secrets.secretName | default "insight-secrets" }}
                  key: insight--backend--azure-storage-connection-string
                  optional: true
            {{- end }}
            - name: FEATURE_DRAFT_AI_GENERATION_ENABLED
              value: {{ .Values.backend.env.FEATURE_DRAFT_AI_GENERATION_ENABLED | default "true" | quote }}
            # Indexer V2 configuration (feature-flagged, default off)
            {{- if .Values.backend.env.INDEXER_V2_ENABLED }}
            - name: INDEXER_V2_ENABLED
              value: {{ .Values.backend.env.INDEXER_V2_ENABLED | quote }}
            {{- end }}
            {{- /* INDEXER_V2 targets the peer rag-ingestion app: publish to rag's
               control queue (appInfra.ragControlQueue), stamped with this tenant's
               name + application id (appInfra.tenantName/applicationId, which the
               operator injects from insight's own Terraform outputs). Prefer the
               operator-injected appInfra.* peer/identity keys; fall back to the
               backend.env literals for envs without injection. */}}
            {{- if or .Values.appInfra.ragControlQueue .Values.backend.env.INDEXER_V2_INPUT_QUEUE }}
            - name: INDEXER_V2_INPUT_QUEUE
              value: {{ .Values.appInfra.ragControlQueue | default .Values.backend.env.INDEXER_V2_INPUT_QUEUE | quote }}
            {{- end }}
            {{- if or .Values.appInfra.tenantName .Values.backend.env.INDEXER_V2_TENANT_ID }}
            - name: INDEXER_V2_TENANT_ID
              value: {{ .Values.appInfra.tenantName | default .Values.backend.env.INDEXER_V2_TENANT_ID | quote }}
            {{- end }}
            {{- if or .Values.appInfra.applicationId .Values.backend.env.INDEXER_V2_APP_ID }}
            - name: INDEXER_V2_APP_ID
              value: {{ .Values.appInfra.applicationId | default .Values.backend.env.INDEXER_V2_APP_ID | quote }}
            {{- end }}
            {{- if .Values.backend.workloadIdentity.enabled }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.appInfra.workloadIdentityClientId | default .Values.backend.workloadIdentity.clientId | default "" | quote }}
            {{- end }}
            {{- include "insight.otelEnv" $ | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.path }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.path }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.seedOrganization.enabled }}
      volumes:
        - name: seed-org-script
          configMap:
            name: insight-seed-org-script
      {{- end }}
{{- end }}
