# Digital Simulator
digitalSimulator:
  enabled: true
  # Keep at 1 until migrations are gated (Job or advisory lock). The Deployment
  # initContainer runs unlocked `alembic upgrade head` per pod.
  replicaCount: 1
  image:
    repository: insight-digital-simulator
    tag: latest
  service:
    type: ClusterIP
    port: 8010
  env:
    DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/backend"
    BACKEND_API_URL: "http://backend:8002"
    LLM_GATEWAY_URL: "http://llm-gateway:8005"
    DECISION_REGISTER_URL: "http://decision-register:8011"
    DECISION_REGISTER_INTERNAL_API_KEY: ""
    TRANSLATION_SERVICE_URL: "http://translation:8012"
    ENVIRONMENT: development
    DEBUG: "true"
    LOG_LEVEL: INFO
    API_PREFIX: /api/v1
    SIMULATION_LLM_CALL_TIMEOUT_SECONDS: "120"
    SIMULATION_MAX_DURATION_SECONDS: "3600"
    REWRITE_THRESHOLD_WORDS: "100"
  workloadIdentity:
    enabled: false
    serviceAccountName: "digital-simulator-sa"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

# Translation Service
translation:
  enabled: true
  replicaCount: 1
  image:
    repository: insight-translation
    tag: latest
  service:
    type: ClusterIP
    port: 8012
  env:
    API_PREFIX: /api/v1
    ENVIRONMENT: development
    LOG_LEVEL: INFO
    TRANSLATION_DEFAULT_TARGET_LANGUAGE: ar-AE
    TRANSLATION_LLM_DEPLOYMENT: "translation"
    LLM_GATEWAY_URL: "http://llm-gateway:8005"
    LLM_GATEWAY_API_KEY: ""
    AZURE_TRANSLATOR_ENDPOINT: ""
    AZURE_TRANSLATOR_REGION: ""
    AZURE_TRANSLATOR_KEY: ""
    AZURE_OPENAI_ENDPOINT: ""
    AZURE_OPENAI_API_KEY: ""
  workloadIdentity:
    enabled: false
    serviceAccountName: "translation-sa"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "750m"
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 30
    livenessFailureThreshold: 5
    readinessFailureThreshold: 5
    startupProbe:
      enabled: true

# Decision Register
decisionRegister:
  enabled: true
  # Keep at 1 until migrations are gated (Job or advisory lock). The Deployment
  # initContainer runs unlocked `alembic upgrade head` per pod.
  replicaCount: 1
  image:
    repository: insight-decision-register
    tag: latest
  service:
    type: ClusterIP
    port: 8011
  env:
    DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/backend"
    BACKEND_API_URL: "http://backend:8002"
    LLM_GATEWAY_URL: "http://llm-gateway:8005"
    TRANSLATION_SERVICE_URL: "http://translation:8012"
    DECISION_REGISTER_INTERNAL_API_KEY: ""
    API_PREFIX: /api/v1
    ENVIRONMENT: development
    LOG_LEVEL: INFO
  workloadIdentity:
    enabled: false
    serviceAccountName: "decision-register-sa"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

# Cortex service (per-tenant Insight <-> Cortex integration service)
cortex:
  enabled: true
  # 2 replicas support rolling updates / zero-downtime deploys for authz/role
  # resolution; true node-HA also needs pod anti-affinity (tracked separately).
  replicaCount: 2
  image:
    repository: insight-saas-cortex
    tag: latest
  service:
    type: ClusterIP
    port: 8004
  env:
    API_PREFIX: /api/v1
    ENVIRONMENT: development
    LOG_LEVEL: INFO
    # Platform authz-service (SpiceDB-backed roles). URL is the cross-namespace
    # FQDN (authz-service lives in cortex-authz, not this namespace). Both the
    # admin and check tokens are sourced from the authz-admin-credentials Secret
    # in the template (cortex.yaml), not from values.
    AUTHZ_SERVICE_URL: "http://authz-service.cortex-authz.svc.cluster.local:8080"
    AUTHZ_ROLE_CACHE_TTL_SECONDS: "30"
  workloadIdentity:
    enabled: false
    serviceAccountName: "cortex-sa"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

# Ingress (disabled for local development)
ingress:
  enabled: false  # Enable for external access
  className: nginx  # Or 'azure-application-gateway' for Azure
  host: localhost
  path: /
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

gateway:
  httpRoute:
    enabled: false
    host: ""
    parentRefs:
      - name: tenant-gateway
        sectionName: https
      - name: tenant-gateway
        sectionName: http
    frontend:
      serviceName: frontend
      servicePort: 80
    bff:
      serviceName: bff
      servicePort: 8001
    # Envoy route timeouts (Gateway API HTTPRouteTimeouts). Defaults avoid
    # 504 UT on large /api/ uploads.
    timeouts:
      api:
        request: "120s"
        backendRequest: "120s"

# Generic route toggle used by the tenant-operator for Helm apps.
# The operator always injects route.hostname as <appId>.<subdomain>.cortex.ai.
# Keep gateway.httpRoute.* for explicit chart-level overrides.
route:
  enabled: false
  hostname: ""

spicedb:
  enabled: true
  replicaCount: 1
  image:
    repository: authzed/spicedb
    tag: v1.29.0
  service:
    name: spicedb
    grpcPort: 50051
    httpPort: 8443
  presharedKey:
    secretName: spicedb-config
    key: preshared_key
  datastore:
    engine: postgres
    secretName: spicedb-postgres-credentials
    connectionUriKey: connection-uri
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
