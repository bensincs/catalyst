          api_base: http://ai-gateway.agent-gateway.svc.cluster.local:8080/v1
          api_key: gateway
          extra_headers: {"x-model-id": "gpt-5.1"}
      - model_name: agentic-chat
        litellm_params:
          model: openai/gpt-5.1
          api_base: http://ai-gateway.agent-gateway.svc.cluster.local:8080/v1
          api_key: gateway
          extra_headers: {"x-model-id": "gpt-5.1"}
      - model_name: agentic-insights
        litellm_params:
