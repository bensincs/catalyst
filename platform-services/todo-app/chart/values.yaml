# Default values for the todo-app chart.
# -----------------------------------------------------------------------------
# The `database.*` block is the integration point with the Bicep PostgreSQL
# module. A provisioning platform should map the Bicep module outputs onto these
# values (see charts/todo-app/README.md and docs/wiring.md).
# -----------------------------------------------------------------------------

replicaCount: 2

image:
  # Published to GHCR, e.g. ghcr.io/bensincs/todoapp
  repository: ghcr.io/bensincs/todoapp
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion when left empty.
  tag: ""

# Secrets for pulling the image from a private registry (GHCR can be public).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Database connection.
#
#   Bicep module output  ->  value here
#   -------------------      -----------------------
#   host                 ->  database.host
#   port                 ->  database.port
#   databaseName         ->  database.name
#   administratorLogin   ->  database.user
#   sslMode              ->  database.sslMode
#
# The password is NOT a Bicep output (secrets must not be emitted as outputs).
# Supply it one of two ways:
#   1. Set database.password and let this chart create the Secret, or
#   2. Point database.existingSecret at a Secret you created out-of-band
#      (recommended when a platform manages the credential).
# -----------------------------------------------------------------------------
database:
  host: ""
  port: 5432
  name: todos
  user: ""
  sslMode: require

  # Option 1: chart-managed Secret.
  password: ""

  # Option 2: pre-existing Secret (takes precedence over `password`).
  existingSecret: ""
  existingSecretPasswordKey: password

app:
  logLevel: info
  # Startup DB-connection retry window (pod may start before the DB is ready).
  dbConnectRetries: 15
  dbConnectBackoffSeconds: 2

# Extra environment variables injected verbatim into the container.
extraEnv: []
#  - name: SOME_FLAG
#    value: "true"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: todo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: todo-tls
  #    hosts:
  #      - todo.example.com

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Gives the app time to retry the DB connection on cold start before the
# liveness probe can kill it.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# Writable scratch space required because the root filesystem is read-only.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
