apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.fullname" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ .Values.database.host | quote }}
  DATABASE_PORT: {{ .Values.database.port | quote }}
  DATABASE_NAME: {{ .Values.database.name | quote }}
  DATABASE_USER: {{ .Values.database.user | quote }}
  DATABASE_SSLMODE: {{ .Values.database.sslMode | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  DB_CONNECT_RETRIES: {{ .Values.app.dbConnectRetries | quote }}
  DB_CONNECT_BACKOFF_SECONDS: {{ .Values.app.dbConnectBackoffSeconds | quote }}
