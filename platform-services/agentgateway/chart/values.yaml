# agentgateway, run as a standalone binary.
#
# Upstream also ships a Kubernetes mode built on the Gateway API, with its own
# controller and CRDs. That mode is not used here — see NOTES.md for why.

image:
  repository: cortexcpacr6hy6uurw.azurecr.io/images/agentgateway
  tag: v1.5.0
  pullPolicy: IfNotPresent

# The kubelet has no registry credential of its own; the reconciler puts this
# secret in every application namespace.
imagePullSecrets:
  - name: cortex-registry

# Where UI-managed configuration and request logs are kept. Wired to a
# PostgreSQL server the platform provisions.
#
# With this disabled agentgateway still runs, but everything done in the UI
# lives in the pod: it is lost on restart, and two replicas cannot agree on it.
database:
  enabled: true
  host: ""
  port: 5432
  name: agentgateway
  user: agwadmin
  sslMode: require

secrets:
  # The Kubernetes Secret the platform materialises from the tenant's vault.
  secretName: agentgateway-secrets
  postgresPasswordKey: postgres-password

# Two. UI-managed configuration lives in the database rather than in the pod,
# so replicas agree with each other and one can be lost without taking the
# gateway down. With `database.enabled: false` this must be 1 — see NOTES.md.
replicas: 2

# The port the UI is served on, and what the platform routes to.
port: 4000

# The gateway the UI attaches to. "default" is reserved by agentgateway for the
# gateway its own bootstrap config creates, so this is named for what it does.
uiGatewayName: ui

# Readiness and metrics. Separate from the UI port so that neither is published
# through the platform's gateway.
readinessPort: 15021
statsPort: 15020

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 1, memory: 1Gi }

nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
