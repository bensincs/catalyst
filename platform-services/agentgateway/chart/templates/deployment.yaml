apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentgateway.fullname" . }}
  labels: {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "agentgateway.selectorLabels" . | nindent 6 }}
  {{- if not .Values.database.enabled }}
  # Without a database the configuration lives in the pod, so two of them must
  # never overlap: a rolling update would briefly serve two different
  # configurations behind one Service. Recreate accepts a gap instead.
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      labels: {{- include "agentgateway.selectorLabels" . | nindent 8 }}
      annotations:
        # Restarts the pod when the configuration changes. Without this the
        # ConfigMap is updated and nothing reads it, so a config change appears
        # to do nothing at all.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if gt (int .Values.replicas) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "agentgateway.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agentgateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["--file", "/config/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: readiness
              containerPort: {{ .Values.readinessPort }}
            - name: stats
              containerPort: {{ .Values.statsPort }}
          env:
            # The root filesystem is read-only, so anything the process writes
            # relative to HOME has to land on a writable volume.
            - name: HOME
              value: /tmp
            {{- if .Values.database.enabled }}
            # Assembled here rather than written into the ConfigMap, so the
            # password is never in a resource that is readable as plain text.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: {{ .Values.secrets.postgresPasswordKey }}
            - name: AGENTGATEWAY_DATABASE_URL
              value: "postgres://{{ .Values.database.user }}:$(PGPASSWORD)@{{ required "database.host is required when database.enabled" .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # agentgateway publishes a readiness endpoint of its own, so neither
          # probe has to guess from a socket being open.
          readinessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Mounted straight from the ConfigMap. This is only safe because
        # UI-managed configuration goes to the database — see the ConfigMap.
        - name: config
          configMap:
            name: {{ include "agentgateway.fullname" . }}
        - name: tmp
          emptyDir: {}
