{{/*
agentgateway's configuration.

This is a BASELINE only. `storage.mode: hybrid` means anything managed from the
UI is written to the database instead of back here, so the two are not in
competition: this file says what the platform deploys, the database holds what
an operator has since changed.

Mounted read-only. That is safe precisely because the UI writes to the database
— with storage in `file` mode a read-only mount makes every save in the UI fail.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentgateway.fullname" . }}
  labels: {{- include "agentgateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      # Bound to all interfaces so the kubelet can reach them. These default to
      # localhost, where a probe from outside the container cannot see them.
      readinessAddr: 0.0.0.0:{{ .Values.readinessPort }}
      statsAddr: 0.0.0.0:{{ .Values.statsPort }}
      # Left on localhost deliberately. The admin interface has no
      # authentication of its own, and this pod is reachable from anywhere in
      # the cluster.
      adminAddr: 127.0.0.1:15000

      {{- if .Values.database.enabled }}
      # The URL carries a password, so it is assembled in the environment from a
      # Kubernetes Secret and referenced here. Writing it into this ConfigMap
      # would put the credential in plain sight of anyone who can read the
      # namespace.
      database:
        url: $AGENTGATEWAY_DATABASE_URL
      storage:
        # Read this file as a baseline, keep UI-managed resources in the
        # database. Without this the UI's changes live in the pod and are lost
        # with it, and two replicas would disagree about the configuration.
        #
        # Nested under `config`, not at the top level: the top level rejects it
        # outright and lists the fields it does accept.
        mode: hybrid
      {{- end }}

    gateways:
      {{ .Values.uiGatewayName }}:
        port: {{ .Values.port }}

    # By default the UI is served only on the admin interface, which is not
    # reachable from outside the pod. Attaching it to a gateway is what puts it
    # on the port the platform routes to.
    #
    # Upstream strongly recommends OIDC in front of the UI when it is exposed
    # this way. That is what authRequired does in register.json: the platform
    # puts oauth2-proxy and Oathkeeper in front, so the UI is never reachable
    # without a completed login. Removing authRequired publishes an unauthenticated
    # admin interface.
    ui:
      gateways: {{ .Values.uiGatewayName }}
