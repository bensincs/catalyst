<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App access</title>
<style>
  :root{
    --bg:#fbfbfd; --panel:#fff; --ink:#1b1b1f; --muted:#5f6169;
    --line:#e4e4ea; --accent:#3b2ea8; --danger:#a4262c; --ok:#0f6d3f;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:20px 24px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600}
  .who{color:var(--muted);font-size:13px}
  main{max-width:820px;margin:0 auto;padding:24px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  select,input{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font:inherit;background:#fff;color:inherit}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .actions{display:flex;gap:10px;align-items:center}
  button{padding:9px 15px;border-radius:8px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
  button:disabled{opacity:.55;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:9px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  .remove{background:#fff;border-color:var(--line);color:var(--danger);font-weight:500;padding:5px 10px}
  .msg{margin:14px 0 0;padding:10px 12px;border-radius:8px;font-size:14px;display:none}
  .msg.err{display:block;background:#fdf3f4;color:var(--danger);border:1px solid #f0d3d5}
  .msg.ok{display:block;background:#f1f8f4;color:var(--ok);border:1px solid #cfe8da}
  .empty{color:var(--muted);padding:9px 0}
  h2{font-size:14px;margin:0 0 12px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>App access</h1>
  <span class="who" id="who">checking…</span>
</header>
<main>
  <div class="panel">
    <div class="row">
      <div>
        <label for="app">Application</label>
        <select id="app"></select>
      </div>
      <div>
        <label for="role">Role</label>
        <select id="role"></select>
      </div>
    </div>
    <label for="subject">Grant access to</label>
    <div class="actions">
      <input id="subject" type="email" placeholder="name@example.com"
             autocomplete="off" spellcheck="false">
      <button id="grant">Grant</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>

  <div class="panel">
    <h2>Who has access</h2>
    <ul id="members"></ul>
  </div>
</main>
<script src="./app.js"></script>
</body>
</html>
