<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App access</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<!-- Hidden when embedded: the console supplies the header, and repeating it
     inside the frame reads as a page within a page. -->
<header class="topbar" id="topbar">
  <h1>App access</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm4.3-1.3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search people or apps"
             autocomplete="off" spellcheck="false" aria-label="Search people or apps">
    </div>
    <button class="btn primary" id="add">Add person</button>
  </div>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="panel">
    <table class="grants">
      <thead>
        <tr><th>Person</th><th>Has access to</th><th class="right">&nbsp;</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden></p>
  </div>
</main>

<!-- Adding is a focused task, so it gets a dialog rather than a permanent form
     competing with the table for attention. -->
<dialog id="dlg">
  <form method="dialog" id="addform">
    <h2>Add person</h2>
    <div class="field">
      <label for="subject">Email address</label>
      <input id="subject" type="email" placeholder="name@example.com"
             autocomplete="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="apps">Applications</label>
      <div class="checks" id="apps"></div>
    </div>
    <div class="field">
      <label for="role">Role</label>
      <select id="role"></select>
    </div>
    <p class="msg" id="dlgmsg" role="status" aria-live="polite"></p>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" id="save" value="save">Grant access</button>
    </div>
  </form>
</dialog>

<script src="./app.js"></script>
</body>
</html>
