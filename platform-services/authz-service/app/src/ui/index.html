<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App access</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<!-- Hidden when embedded: the console already provides a header, and repeating
     it inside the frame reads as a page within a page. -->
<header class="topbar" id="topbar">
  <h1>App access</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <section class="panel">
    <header class="panel-head">
      <h2>Grant access</h2>
      <p class="hint">Anyone with a role on an application can reach it.</p>
    </header>

    <div class="grid">
      <div class="field">
        <label for="app">Application</label>
        <select id="app"></select>
      </div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role"></select>
      </div>
    </div>

    <div class="field">
      <label for="subject">Person</label>
      <div class="inline">
        <input id="subject" type="email" placeholder="name@example.com"
               autocomplete="off" spellcheck="false">
        <button class="btn primary" id="grant">Grant</button>
      </div>
    </div>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <header class="panel-head">
      <h2>Who has access</h2>
      <span class="count" id="count"></span>
    </header>
    <ul class="members" id="members"></ul>
  </section>
</main>

<script src="./app.js"></script>
</body>
</html>
