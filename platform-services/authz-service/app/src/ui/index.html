<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App access</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<!-- Hidden when embedded: the console supplies the header, and repeating it
     inside the frame reads as a page within a page. -->
<header class="topbar" id="topbar">
  <h1>App access</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm4.3-1.3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search people or applications"
             autocomplete="off" spellcheck="false" aria-label="Search people or applications">
    </div>
    <span class="muted" id="summary" aria-live="polite"></span>
    <button class="btn primary" id="add">Add person</button>
  </div>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="panel">
    <table class="grants">
      <caption class="sr-only">People and the applications they can reach</caption>
      <thead>
        <tr>
          <th scope="col">Person</th>
          <th scope="col">Has access to</th>
          <th scope="col"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="state" id="state"></p>
  </div>
</main>

<!-- One editor for both adding and changing: a person's access is a single
     thing to think about, so it is edited in one place and applied on save,
     rather than by removing one item at a time with no chance to reconsider. -->
<dialog id="dlg" aria-labelledby="dlgtitle">
  <h2 id="dlgtitle">Add person</h2>

  <div class="field" id="subjectfield">
    <label for="subject">Email address</label>
    <input id="subject" type="email" placeholder="name@example.com"
           autocomplete="off" spellcheck="false">
  </div>

  <div class="field">
    <span class="label">Applications</span>
    <div class="applist" id="applist"></div>
  </div>

  <p class="msg" id="dlgmsg" role="status" aria-live="polite"></p>

  <div class="dlg-actions">
    <button class="btn" id="cancel" type="button">Cancel</button>
    <button class="btn primary" id="save" type="button">Save</button>
  </div>
</dialog>

<script src="./app.js"></script>
</body>
</html>
