[project]
name = "cortex-otel"
version = "0.1.0"
description = "Shared OpenTelemetry SDK bootstrap for Cortex Python services"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-logging>=0.48b0,<1.0.0",
]

[project.optional-dependencies]
fastapi = [
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0.0",
]
httpx = [
    "opentelemetry-instrumentation-httpx>=0.65b0,<1.0.0",
]
grpc = [
    "opentelemetry-instrumentation-grpc>=0.48b0,<1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_otel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cortex_otel"]
