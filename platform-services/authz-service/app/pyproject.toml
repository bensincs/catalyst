[project]
name = "authz-service"
version = "0.1.0"
description = "Cortex Authorization Service — SpiceDB-backed fine-grained permission checks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.30.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "authzed>=0.15.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "PyJWT>=2.8.0",
    "starlette>=1.3.1",
    "cortex-otel[fastapi,grpc]",
]

[tool.uv.sources]
cortex-otel = { path = "./libs/cortex-otel", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/routes", "src/data", "src/common", "src/config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
