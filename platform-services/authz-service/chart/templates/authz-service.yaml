apiVersion: v1
kind: Service
metadata:
  name: authz-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: authz-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: authz-service }
  template:
    metadata:
      labels: { app: authz-service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authz-service
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: SPICEDB_ENDPOINT
              value: "spicedb.{{ .Values.namespace }}.svc.cluster.local:50051"
            # The apex the ext-authz Host parser matches
            # <app>.<subdomain>.<domain> against. It MUST equal the domain the
            # platform publishes apps on, or every request is denied with 403.
            - name: ROUTING_DOMAIN
              value: {{ required "routingDomain is required" (.Values.routingDomain | trim) | quote }}
            - name: SPICEDB_INSECURE
              value: "true"
            - name: AUTHZ_TENANT_ID
              value: {{ required "tenantId is required" (.Values.tenantId | trim) | quote }}
            - name: AUTHZ_ADMIN_APP
              value: {{ .Values.adminApp | quote }}
            - name: AUTHZ_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: AUTHZ_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            - name: SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: {{ .Values.secrets.spicedbPresharedKeyKey }}
            - name: AUTHZ_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: {{ .Values.secrets.adminTokenKey }}
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.authz | nindent 12 }}
