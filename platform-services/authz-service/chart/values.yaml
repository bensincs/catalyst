# Extracted from the Cortex platform chart
# (platform/charts/cortex-platform-0.1.0/.../templates/authz-service.yaml).
#
# What was deliberately left behind: the legacy credential-rotation and
# in-cluster-to-managed Postgres migration jobs, the Cilium L7 policies, and the
# cert-manager Certificate for the local Postgres. Those exist to carry an
# already-running Cortex installation forward; a first install here has nothing
# to migrate from.

namespace: cortex-authz

image: cortexcpacr6hy6uurw.azurecr.io/images/authz-service:0.1.0
imagePullPolicy: IfNotPresent
# Two, for the same reason as SpiceDB: this service is in the request path of
# every application behind the gateway. It also keeps the PodDisruptionBudget
# honest — minAvailable 1 against a single replica permits no disruption at
# all, which blocks node drains and stalls cluster upgrades.
replicas: 2
# SpiceDB answers every authenticated request in the tenant. One replica makes
# a node drain a tenant-wide outage; it is stateless (state lives in Postgres),
# so a second costs nothing but scheduling.
spicedbReplicas: 2

images:
  spicedb: docker.io/authzed/spicedb:v1.29.0
  zed: docker.io/authzed/zed:v0.21.1
  postgres: docker.io/library/postgres:16-alpine
  busybox: docker.io/library/busybox:1.36

# The apex the ext-authz Host parser matches <app>.<subdomain>.<domain>
# against. It MUST equal the domain the platform publishes apps on, or every
# request is denied with 403.
routingDomain: ""

# The single tenant this deployment serves. Identity and every relationship are
# scoped to it, and it is configuration precisely so no request can change it.
tenantId: ""

# The application the admin UI itself is protected by. Holding a role on it is
# what makes someone an administrator of app access.
adminApp: authz-admin

# The admin UI establishes who is calling from a VERIFIED OIDC token, because
# the X-Cortex-* headers the gateway stamps mean nothing when this Service is
# reached directly — which anything in the cluster can do. Without these the
# UI refuses every request rather than falling back to trusting headers.
oidc:
  issuer: ""
  # The application the token must be issued for: a token minted for something
  # else is not proof of anything here.
  audience: ""

# Secrets are supplied by the platform's secret store, which materialises them
# as a Kubernetes Secret in this namespace. Nothing here holds a credential.
secrets:
  secretName: authz-secrets
  spicedbPresharedKeyKey: spicedb-preshared-key
  adminTokenKey: authz-admin-token
  postgresPasswordKey: postgres-password

# SpiceDB's datastore, supplied by this service's infrastructure. The
# authorization store is where every access decision is ultimately resolved, so
# it is a managed database rather than a pod with a volume.
postgres:
  host: ""
  port: "5432"
  user: ""
  database: spicedb
  sslMode: require

# Who can administer app access before anyone has been granted it.
#
# Access to an application is derived from app-role membership, so on a fresh
# install nobody holds any role — including the role needed to reach the admin
# UI and grant one. Without at least one seeded member that is a closed loop.
# These members are written once at install; everyone else is added through the
# UI afterwards.
seed:
  enabled: true
  app: authz-admin
  role: admin
  # Subjects, e.g. "user:ben@msft.ae". A bare address is treated as a user.
  members: []

resources:
  authz:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  spicedb:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  postgres:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Keeps one replica of each serving through a node drain.
podDisruptionBudgets:
  enabled: true
